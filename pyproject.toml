[project]
name = "asi-os"
version = "0.1.0"
description = "AI-native operating environment for agents, models, memory, tools, and bounded autonomy."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13,<3",
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16,<1",
  "mypy>=2.3,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asi_os"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
